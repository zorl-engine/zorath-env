[package]
name = "zorath-env"
version = "0.1.2"
edition = "2021"
description = "A tiny CLI to validate .env using a schema, generate docs, and keep config sane."
license = "MIT"
repository = "https://github.com/zorl-engine/zorath-env"
readme = "README.md"

[[bin]]
name = "zenv"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
thiserror = "1.0"
url = "2.5"

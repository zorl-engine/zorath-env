[package]
name = "zorath-env"
version = "0.3.10"
edition = "2021"
# MSRV: 1.74 is required by clap 4.5.x. zenv also uses Ipv6Addr::to_ipv4_mapped
# (stable since 1.63) and std::sync::OnceLock (stable since 1.70), both well
# below this floor. Bumping clap or adopting newer std features is the main
# driver to revisit this -- check `cargo msrv find` if either changes.
rust-version = "1.74"
description = "Fast CLI for .env validation against JSON/YAML schemas. 14 types, secret detection, watch mode, remote schemas, 7 export formats, CI templates, health diagnostics, code scanning, auto-fix. Language-agnostic single binary."
license = "MIT"
repository = "https://github.com/zorl-engine/zorath-env"
homepage = "https://zorl.cloud/zenv"
documentation = "https://github.com/zorl-engine/zorath-env/wiki"
readme = "README.md"
keywords = ["dotenv", "env", "validation", "schema", "secrets"]
categories = ["command-line-utilities", "development-tools", "config"]

[lib]
name = "zorath_env"
path = "src/lib.rs"

[[bin]]
name = "zenv"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
regex = "1.10"
thiserror = "2.0"
url = "2.5"
ureq = "3.1"
dirs = "6.0"
notify = "8.2"
ignore = "0.4"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.10"

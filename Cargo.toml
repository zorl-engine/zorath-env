[package]
name = "zorath-env"
version = "0.3.4"
edition = "2021"
description = "Fast CLI for .env validation against JSON schemas. Type checking, secret detection, remote schemas, env diff, docs generation. CI-friendly exit codes. Language-agnostic, single-binary CLI."
license = "MIT"
repository = "https://github.com/zorl-engine/zorath-env"
homepage = "https://zorl.cloud/zenv"
documentation = "https://github.com/zorl-engine/zorath-env/wiki"
readme = "README.md"
keywords = ["dotenv", "env", "validation", "schema", "secrets"]
categories = ["command-line-utilities", "development-tools", "config"]

[[bin]]
name = "zenv"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
thiserror = "1.0"
url = "2.5"
ureq = { version = "2.12", features = ["tls"] }
dirs = "5.0"
notify = "6.1"

[dev-dependencies]
tempfile = "3.10"

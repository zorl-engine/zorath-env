[package]
name = "zorath-env"
version = "0.4.0"
edition = "2021"
# This project tracks the current stable Rust toolchain.
# CI checks this floor against Cargo.lock; revisit it when updating dependencies.
rust-version = "1.99"
description = "Fast CLI for .env validation against JSON/YAML schemas. 14 types, secret detection, watch mode, remote schemas, 7 export formats, CI templates, health diagnostics, code scanning, auto-fix. Language-agnostic single binary."
license = "MIT"
repository = "https://github.com/zorl-engine/zorath-env"
homepage = "https://zorl.cloud/zenv"
documentation = "https://github.com/zorl-engine/zorath-env/wiki"
readme = "README.md"
keywords = ["dotenv", "env", "validation", "schema", "secrets"]
categories = ["command-line-utilities", "development-tools", "config"]

[lib]
name = "zorath_env"
path = "src/lib.rs"

[[bin]]
name = "zenv"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-saphyr = "2"
regex = "1.10"
thiserror = "2.0"
url = "2.5"
# The checked DNS resolver uses ureq's unversioned API; review minor upgrades.
ureq = "~3.1.4"
dirs = "6.0"
notify = "8.2"
ignore = "0.4"
sha2 = "0.10"

tempfile = "3.10"

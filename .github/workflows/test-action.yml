name: Test GitHub Action

on:
  push:
    branches: ["main"]
    paths:
      - '.github/actions/zenv-action/**'
      - '.github/workflows/test-action.yml'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    paths:
      - '.github/actions/zenv-action/**'
      - '.github/workflows/test-action.yml'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:
  workflow_call:

# Least privilege: only checks out + runs the action; no repo writes.
permissions:
  contents: read

jobs:
  test-action-valid:
    name: Test with valid .env
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build zenv from source
        run: |
          cargo build --release --locked
          mkdir -p ~/.local/bin
          cp target/release/zenv ~/.local/bin/
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Verify zenv
        run: ~/.local/bin/zenv version

      - name: Setup test files
        run: |
          cp examples/.env.example .env
          cp examples/env.schema.json env.schema.json

      - name: Run zenv action
        id: zenv
        uses: ./.github/actions/zenv-action
        with:
          skip-install: 'true'
          schema: env.schema.json
          env-file: .env

      - name: Check outputs
        env:
          VALID: ${{ steps.zenv.outputs.valid }}
          ERRORS: ${{ steps.zenv.outputs.errors }}
        run: |
          test "$VALID" = true
          test "$ERRORS" = '[]'

  test-action-invalid:
    name: Test with invalid .env
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build zenv from source
        run: |
          cargo build --release --locked
          mkdir -p ~/.local/bin
          cp target/release/zenv ~/.local/bin/
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Verify zenv
        run: ~/.local/bin/zenv version

      - name: Setup test files
        run: |
          # Create an invalid .env (wrong type for PORT)
          echo "PORT=not_a_number" > .env
          echo "DATABASE_URL=postgres://localhost/db" >> .env
          cp examples/env.schema.json env.schema.json

      - name: Run zenv action (expect failure)
        id: zenv
        uses: ./.github/actions/zenv-action
        continue-on-error: true
        with:
          skip-install: 'true'
          schema: env.schema.json
          env-file: .env

      - name: Check outputs
        env:
          VALID: ${{ steps.zenv.outputs.valid }}
          ERRORS: ${{ steps.zenv.outputs.errors }}
          OUTCOME: ${{ steps.zenv.outcome }}
        run: |
          test "$OUTCOME" = failure
          test "$VALID" = false
          printf '%s' "$ERRORS" | jq -e 'type == "array" and length > 0'

  test-action-missing-env:
    name: Test with missing .env (allowed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build zenv from source
        run: |
          cargo build --release --locked
          mkdir -p ~/.local/bin
          cp target/release/zenv ~/.local/bin/
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Verify zenv
        run: ~/.local/bin/zenv version

      - name: Setup test files
        run: |
          # Only copy schema, no .env file
          cp examples/env.schema.json env.schema.json

      - name: Run zenv action with allow-missing-env
        id: zenv
        uses: ./.github/actions/zenv-action
        with:
          skip-install: 'true'
          schema: env.schema.json
          env-file: .env
          allow-missing-env: 'true'

      - name: Check outputs
        env:
          VALID: ${{ steps.zenv.outputs.valid }}
          ERRORS: ${{ steps.zenv.outputs.errors }}
        run: |
          test "$VALID" = true
          test "$ERRORS" = '[]'

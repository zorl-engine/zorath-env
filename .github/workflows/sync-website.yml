name: Sync Website

on:
  # Releases made with GITHUB_TOKEN do not trigger release-event workflows.
  # The release workflow calls this explicitly after crates.io publication.
  workflow_call:
    inputs:
      version:
        required: true
        type: string
    secrets:
      ZORL_WEBSITE_TOKEN:
        required: true
  # Trigger after a release is published
  release:
    types: [published]

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to sync (leave empty to use the checked-out Cargo version)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  sync:
    name: Sync to zorl.cloud
    runs-on: ubuntu-latest
    steps:
      - name: Checkout zenv
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Checkout zorl.cloud
        uses: actions/checkout@v6
        with:
          repository: Rex0Lux/zorl
          ref: master
          path: website
          token: ${{ secrets.ZORL_WEBSITE_TOKEN }}

      - name: Get version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${INPUT_VERSION:-${RELEASE_TAG#v}}"
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ]; then
            VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version" >&2
            exit 1
          fi
          printf 'VERSION=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"

      - name: Run sync script
        env:
          SYNC_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          node scripts/sync-website.js \
            --version "$SYNC_VERSION" \
            --website-path ./website

      - name: Commit and push
        working-directory: website
        env:
          SYNC_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/zenv.json public/llms.txt
          git diff --staged --quiet || git commit -m "Update zenv to v$SYNC_VERSION"
          git push

      - name: Summary
        env:
          SYNC_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          echo "## Sync Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Version: v$SYNC_VERSION" >> $GITHUB_STEP_SUMMARY
          echo "- Repository: Rex0Lux/zorl (master)" >> $GITHUB_STEP_SUMMARY
          echo "- File: src/data/zenv.json" >> $GITHUB_STEP_SUMMARY

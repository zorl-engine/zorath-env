name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --verbose

      - name: Run clippy
        run: cargo clippy -- -D warnings

      - name: Run tests
        run: cargo test --verbose

      - name: Smoke test (all 13 commands)
        shell: bash
        run: |
          # Stage fixtures once. The smoke test exercises binary-level clap
          # dispatch for every Command variant -- unit tests cover internals
          # but a typo in a clap derive macro or a removed flag would slip
          # past them. Each invocation asserts exit code 0 unless a
          # non-zero is expected (none currently). Runs on all three OSes
          # via bash -- on Windows that's Git Bash which the runner ships,
          # and $RUNNER_TEMP keeps the temp path portable.
          set -e
          cp examples/.env.example .env
          cp examples/env.schema.json env.schema.json
          OUT="$RUNNER_TEMP/zenv-smoke"
          mkdir -p "$OUT"

          # Core validation + introspection
          cargo run -- check
          cargo run -- docs > "$OUT/ENVIRONMENT.md"
          cargo run -- init --example examples/.env.example --schema "$OUT/env.schema.json"

          # Output generators
          cargo run -- example > "$OUT/example.env"
          cargo run -- example --include-defaults > "$OUT/example-with-defaults.env"
          cargo run -- export --format shell > "$OUT/export.sh"
          cargo run -- export --format docker > "$OUT/export.dockerfile"
          cargo run -- template github > "$OUT/template-github.yml"
          cargo run -- template gitlab > "$OUT/template-gitlab.yml"
          cargo run -- template --list

          # Comparison + repair (write to temp copies so we don't mutate fixtures)
          cp .env "$OUT/.env.copy"
          cargo run -- diff .env "$OUT/.env.copy"
          cargo run -- fix --env "$OUT/.env.copy" --dry-run

          # Scanning + diagnostics. scan exits 1 when code references env vars
          # not in the schema -- expected here, since scanning src/ matches
          # pattern literals like API_KEY inside scan.rs itself. Tolerate
          # exit 1; still fail on a real crash (panic = 101, etc.).
          cargo run -- scan --path src || test $? -eq 1
          cargo run -- doctor

          # Cache subcommands (the only nested-action variant)
          cargo run -- cache stats
          cargo run -- cache clear

          # Shell completions for every supported shell
          cargo run -- completions bash       > "$OUT/completions.bash"
          cargo run -- completions zsh        > "$OUT/completions.zsh"
          cargo run -- completions fish       > "$OUT/completions.fish"
          cargo run -- completions powershell > "$OUT/completions.ps1"

          # Version (no network call -- --check-update would hit crates.io)
          cargo run -- version

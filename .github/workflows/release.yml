name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  security:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      checks: write

  action-tests:
    uses: ./.github/workflows/test-action.yml
    permissions:
      contents: read

  preflight:
    name: Verify release metadata and package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Check tag and version agreement
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release.py --check --tag "$RELEASE_TAG"
      - run: cargo publish --dry-run --locked

  build:
    needs: [ci, security, action-tests, preflight]
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            name: zenv-linux
          - target: x86_64-apple-darwin
            os: macos-latest
            name: zenv-macos-intel
          - target: aarch64-apple-darwin
            os: macos-latest
            name: zenv-macos-arm
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: zenv.exe

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Rename binary (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          mv target/${{ matrix.target }}/release/zenv ${{ matrix.name }}

      - name: Rename binary (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          mv target/${{ matrix.target }}/release/zenv.exe ${{ matrix.name }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ matrix.name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - name: Website publication handoff
        run: |
          echo 'The website repository pulls published stable releases hourly using its own GitHub token.' >> "$GITHUB_STEP_SUMMARY"
          echo 'For an immediate sync, run [Sync zenv release](https://github.com/Rex0Lux/zorl/actions/workflows/sync-zenv.yml) on master using the website account.' >> "$GITHUB_STEP_SUMMARY"
          echo 'After deployment, run [Verify Website](https://github.com/zorl-engine/zorath-env/actions/workflows/verify-website.yml). Review documentation and the wiki separately.' >> "$GITHUB_STEP_SUMMARY"

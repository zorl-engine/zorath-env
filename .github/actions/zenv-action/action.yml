name: 'zenv - Environment Validator'
description: 'Validate .env files against JSON schemas using zenv'
author: 'Zorath LLC'

branding:
  icon: 'check-circle'
  color: 'green'

inputs:
  schema:
    description: 'Path to the JSON schema file'
    required: false
    default: 'env.schema.json'
  env-file:
    description: 'Path to the .env file to validate'
    required: false
    default: '.env'
  allow-missing-env:
    description: 'Allow missing .env file (validates schema defaults only)'
    required: false
    default: 'true'
  version:
    description: 'Version of zenv to use (e.g., "0.3.1" or "latest")'
    required: false
    default: 'latest'

outputs:
  valid:
    description: 'Whether the .env file is valid (true/false)'
    value: ${{ steps.validate.outputs.valid }}
  errors:
    description: 'JSON array of validation error messages (empty if valid)'
    value: ${{ steps.validate.outputs.errors }}

runs:
  using: 'composite'
  steps:
    - name: Determine version
      id: version
      shell: bash
      run: |
        if [ "${{ inputs.version }}" = "latest" ]; then
          # Get latest version from crates.io using jq for reliable parsing
          VERSION=$(curl -s https://crates.io/api/v1/crates/zorath-env | jq -r '.crate.newest_version // empty')
          if [ -z "$VERSION" ]; then
            echo "Warning: Could not fetch version from crates.io, using fallback"
            VERSION="0.3.1"
          fi
        else
          VERSION="${{ inputs.version }}"
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Using zenv version: $VERSION"

    - name: Cache zenv binary
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/.local/bin/zenv
        key: zenv-${{ runner.os }}-${{ steps.version.outputs.version }}

    - name: Install zenv
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        mkdir -p ~/.local/bin
        VERSION="${{ steps.version.outputs.version }}"
        BASE_URL="https://github.com/zorl-engine/zorath-env/releases/download/v${VERSION}"

        # Determine binary name based on OS
        case "${{ runner.os }}" in
          Linux)
            BINARY_NAME="zenv-linux"
            ;;
          macOS)
            if [ "$(uname -m)" = "arm64" ]; then
              BINARY_NAME="zenv-macos-arm"
            else
              BINARY_NAME="zenv-macos-intel"
            fi
            ;;
          Windows)
            BINARY_NAME="zenv.exe"
            ;;
          *)
            echo "Unsupported OS: ${{ runner.os }}"
            exit 1
            ;;
        esac

        # Download prebuilt binary
        echo "Downloading ${BINARY_NAME} from ${BASE_URL}..."
        if curl -sL --fail -o ~/.local/bin/zenv "${BASE_URL}/${BINARY_NAME}"; then
          chmod +x ~/.local/bin/zenv
          echo "Downloaded prebuilt binary successfully"
        else
          echo "Prebuilt binary not available, building from source..."
          # Fallback to cargo install
          if ! command -v cargo &> /dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            source $HOME/.cargo/env
          fi
          cargo install zorath-env --version ${VERSION} --root ~/.local
        fi

    - name: Add zenv to PATH
      shell: bash
      run: echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Verify installation
      shell: bash
      run: |
        zenv version
        echo "zenv installed successfully"

    - name: Validate environment
      id: validate
      shell: bash
      run: |
        set +e

        # Build command
        CMD="zenv check --schema '${{ inputs.schema }}' --env '${{ inputs.env-file }}'"
        if [ "${{ inputs.allow-missing-env }}" = "true" ]; then
          CMD="$CMD --allow-missing-env"
        fi

        # Run validation and capture output
        OUTPUT=$(eval $CMD 2>&1)
        EXIT_CODE=$?

        echo "Command: $CMD"
        echo "Exit code: $EXIT_CODE"
        echo "Output:"
        echo "$OUTPUT"

        if [ $EXIT_CODE -eq 0 ]; then
          echo "valid=true" >> $GITHUB_OUTPUT
          echo "errors=[]" >> $GITHUB_OUTPUT
        else
          echo "valid=false" >> $GITHUB_OUTPUT
          # Convert output to JSON array
          ERRORS=$(echo "$OUTPUT" | grep -E "^  - " | sed 's/^  - //' | jq -R -s -c 'split("\n") | map(select(length > 0))')
          if [ -z "$ERRORS" ] || [ "$ERRORS" = "[]" ]; then
            ERRORS=$(echo "$OUTPUT" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          fi
          echo "errors=$ERRORS" >> $GITHUB_OUTPUT

          # Fail the step
          echo "::error::Environment validation failed"
          exit 1
        fi

name: 'zenv - Environment Validator'
description: 'Validate .env files against JSON schemas using zenv'
author: 'Zorath LLC'

branding:
  icon: 'check-circle'
  color: 'green'

inputs:
  skip-install:
    description: 'Use the zenv binary already on PATH (for testing source builds)'
    required: false
    default: 'false'
  schema:
    description: 'Path to the JSON schema file'
    required: false
    default: 'env.schema.json'
  env-file:
    description: 'Path to the .env file to validate'
    required: false
    default: '.env'
  allow-missing-env:
    description: 'Allow missing .env file (validates schema defaults only)'
    required: false
    default: 'false'
  version:
    description: 'Version of zenv to use (e.g., "0.3.1" or "latest")'
    required: false
    default: 'latest'
  detect-secrets:
    description: 'Scan .env for embedded secrets (API keys, tokens, URL passwords)'
    required: false
    default: 'false'
  verify-hash:
    description: 'SHA-256 hash to verify remote schema integrity (full 64 hex or >=32 hex prefix)'
    required: false
    default: ''
  ca-cert:
    description: 'Path to custom CA certificate (PEM) for enterprise TLS interception'
    required: false
    default: ''
  no-cache:
    description: 'Bypass the remote schema cache for this run'
    required: false
    default: 'false'
  format:
    description: 'Output format for validation results: text or json'
    required: false
    default: 'text'

outputs:
  valid:
    description: 'Whether the .env file is valid (true/false)'
    value: ${{ steps.validate.outputs.valid }}
  errors:
    description: 'JSON array of validation error messages (empty if valid)'
    value: ${{ steps.validate.outputs.errors }}

runs:
  using: 'composite'
  steps:
    - name: Determine version
      if: inputs.skip-install != 'true'
      id: version
      env:
        ZENV_VERSION: ${{ inputs.version }}
      shell: bash
      run: |
        if [ "$ZENV_VERSION" = "latest" ]; then
          # Get latest version from crates.io. A User-Agent is REQUIRED --
          # crates.io returns 403 to UA-less requests, which would silently
          # force the fallback path below on every run.
          VERSION=$(curl -fsSL --connect-timeout 10 --max-time 30 -H "User-Agent: zorath-env-action (github.com/zorl-engine/zorath-env)" https://crates.io/api/v1/crates/zorath-env | jq -r '.crate.max_stable_version // .crate.newest_version // empty') || VERSION=""
          if [ -z "$VERSION" ]; then
            echo "Warning: Could not fetch version from crates.io, using fallback"
            # Fallback version. MUST track Cargo.toml [package].version on
            # release -- scripts/release.py checks exact version agreement.
            # The fallback hits exact-match download paths
            # so a stale value installs an outdated binary on crates.io
            # outages.
            VERSION="0.3.12"
          fi
        else
          VERSION="$ZENV_VERSION"
        fi
        if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
          echo "::error::Invalid zenv version"
          exit 1
        fi
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "Using zenv version: $VERSION"

    - name: Cache zenv binary
      if: inputs.skip-install != 'true'
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/.local/bin/zenv*
        key: zenv-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.version.outputs.version }}

    - name: Install zenv
      if: inputs.skip-install != 'true' && steps.cache.outputs.cache-hit != 'true'
      env:
        ZENV_VERSION: ${{ steps.version.outputs.version }}
      shell: bash
      run: |
        mkdir -p ~/.local/bin
        VERSION="$ZENV_VERSION"
        BASE_URL="https://github.com/zorl-engine/zorath-env/releases/download/v${VERSION}"

        # Determine binary name based on OS
        case "$RUNNER_OS" in
          Linux)
            if [ "$RUNNER_ARCH" = X64 ]; then BINARY_NAME="zenv-linux"; else BINARY_NAME=""; fi
            ;;
          macOS)
            if [ "$(uname -m)" = "arm64" ]; then
              BINARY_NAME="zenv-macos-arm"
            else
              BINARY_NAME="zenv-macos-intel"
            fi
            ;;
          Windows)
            if [ "$RUNNER_ARCH" = X64 ]; then BINARY_NAME="zenv.exe"; else BINARY_NAME=""; fi
            ;;
          *)
            echo "Unsupported OS: $RUNNER_OS"
            exit 1
            ;;
        esac

        DEST="$HOME/.local/bin/zenv"
        if [ "$RUNNER_OS" = Windows ]; then
          DEST="$DEST.exe"
        fi
        DOWNLOAD=$(mktemp)
        trap 'rm -f "$DOWNLOAD"' EXIT

        # Download prebuilt binary
        echo "Downloading ${BINARY_NAME} from ${BASE_URL}..."
        if [ -n "$BINARY_NAME" ] && curl -fsSL --connect-timeout 10 --max-time 120 -o "$DOWNLOAD" "${BASE_URL}/${BINARY_NAME}"; then
          chmod +x "$DOWNLOAD"
          mv "$DOWNLOAD" "$DEST"
          echo "Downloaded prebuilt binary successfully"
        else
          echo "Prebuilt binary not available, building from source..."
          # Fallback to cargo install
          if ! command -v cargo &> /dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            source "$HOME/.cargo/env"
          fi
          cargo install zorath-env --locked --version "$VERSION" --root "$HOME/.local"
        fi

    - name: Add zenv to PATH
      if: inputs.skip-install != 'true'
      shell: bash
      run: echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Verify installation
      shell: bash
      run: |
        zenv version
        echo "zenv installed successfully"

    - name: Validate environment
      id: validate
      shell: bash
      env:
        ZENV_SCHEMA: ${{ inputs.schema }}
        ZENV_ENV_FILE: ${{ inputs.env-file }}
        ZENV_ALLOW_MISSING_ENV: ${{ inputs.allow-missing-env }}
        ZENV_DETECT_SECRETS: ${{ inputs.detect-secrets }}
        ZENV_VERIFY_HASH: ${{ inputs.verify-hash }}
        ZENV_CA_CERT: ${{ inputs.ca-cert }}
        ZENV_NO_CACHE: ${{ inputs.no-cache }}
        ZENV_FORMAT: ${{ inputs.format }}
      run: bash "$GITHUB_ACTION_PATH/validate.sh"
